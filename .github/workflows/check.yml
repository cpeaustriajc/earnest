name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --no-self-update
      - run: rustup default "$RUST_VERSION"
      - run: echo "RUSTC_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: sudo npm install --global rust-just@latest bun@latest typescript@latest
      - uses: actions/cache@v6
        with:
          path: ~/cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ env.RUSTC_VERSION }}-${{ github.run_id }}
          restore-keys: cargo-tools-${{ runner.os }}-${{ env.RUSTC_VERSION }}-
      - run: cargo install --locked --root "$HOME/cargo-tools" cargo-deny cargo-machete
      - run: echo "$HOME/cargo-tools/bin" >> "$GITHUB_PATH"
      - name: Install the newest Verus
        run: |
          version=$(git ls-remote --tags --refs https://github.com/verus-lang/verus 'refs/tags/release/0.*' |
            sed 's#.*refs/tags/release/##' | sort --version-sort | tail -n 1)
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/verus.zip" \
            "https://github.com/verus-lang/verus/releases/download/release/$version/verus-$version-x86-linux.zip"
          unzip -q "$RUNNER_TEMP/verus.zip" -d "$HOME/verus"
          toolchain=$(grep -o '"toolchain": *"[^" ]*' "$HOME/verus/verus-x86-linux/version.json" | sed 's/.*"//')
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          echo "$HOME/verus/verus-x86-linux" >> "$GITHUB_PATH"
          echo "VERUS_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-build-${{ runner.os }}-${{ env.RUSTC_VERSION }}-verus-${{ env.VERUS_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-${{ env.RUSTC_VERSION }}-verus-${{ env.VERUS_VERSION }}-
      - run: just check
      - name: Install the newest TLC
        run: |
          mkdir -p target/tools
          curl --fail --silent --show-error --location --output target/tools/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - run: just tlc
      - run: just benchmark
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends valgrind
      - run: just counts
