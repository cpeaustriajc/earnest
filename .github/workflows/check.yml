name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.100.0
  JUST_VERSION: 1.59.0
  NODE_VERSION: 22.23.5
  BUN_VERSION: 1.4.4
  TYPESCRIPT_VERSION: 6.0.2
  TLC_VERSION: 1.8.0
  TLC_SHA256: fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713
  CARGO_DENY_VERSION: 0.21.0
  CARGO_MACHETE_VERSION: 0.9.1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --no-self-update
      - run: rustup default "$RUST_VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: sudo npm install --global "rust-just@$JUST_VERSION" "bun@$BUN_VERSION" "typescript@$TYPESCRIPT_VERSION"
      - uses: actions/cache@v4
        with:
          path: ~/cargo-tools
          key: cargo-tools-${{ runner.os }}-${{ env.RUST_VERSION }}-deny-${{ env.CARGO_DENY_VERSION }}-machete-${{ env.CARGO_MACHETE_VERSION }}
      - run: cargo install --locked --root "$HOME/cargo-tools" "cargo-deny@$CARGO_DENY_VERSION" "cargo-machete@$CARGO_MACHETE_VERSION"
      - run: echo "$HOME/cargo-tools/bin" >> "$GITHUB_PATH"
      - name: Install the newest Verus
        run: |
          version=$(git ls-remote --tags --refs https://github.com/verus-lang/verus 'refs/tags/release/0.*' |
            sed 's#.*refs/tags/release/##' | sort --version-sort | tail -n 1)
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/verus.zip" \
            "https://github.com/verus-lang/verus/releases/download/release/$version/verus-$version-x86-linux.zip"
          unzip -q "$RUNNER_TEMP/verus.zip" -d "$HOME/verus"
          toolchain=$(grep -o '"toolchain": *"[^" ]*' "$HOME/verus/verus-x86-linux/version.json" | sed 's/.*"//')
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          echo "$HOME/verus/verus-x86-linux" >> "$GITHUB_PATH"
          echo "VERUS_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-build-${{ runner.os }}-${{ env.RUST_VERSION }}-verus-${{ env.VERUS_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-${{ env.RUST_VERSION }}-verus-${{ env.VERUS_VERSION }}-
      - run: just check
      - name: Install TLC
        run: |
          mkdir -p target/tools
          curl --fail --silent --show-error --location --output target/tools/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/v$TLC_VERSION/tla2tools.jar"
          echo "$TLC_SHA256  target/tools/tla2tools.jar" | sha256sum --check --quiet
      - run: just tlc
      - run: just benchmark
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends valgrind
      - run: just counts
