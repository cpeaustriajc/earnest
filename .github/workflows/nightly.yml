name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - .github/scripts/changelog.py
      - cliff.toml
      - install.sh
      - install.ps1

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable
  SMOKE_MODEL: tasks/benchmark/models/mixed/basket.model.ts

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.tag.outputs.tag }}
      previous_sha: ${{ steps.decide.outputs.previous_sha }}
      dated_tag: ${{ steps.decide.outputs.dated_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            install.sh
            install.ps1
          sparse-checkout-cone-mode: false
      - id: tag
        name: Name the tag from the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "no workspace version in Cargo.toml"; exit 1; }
          tag="v$version-nightly"
          for script in install.sh install.ps1; do
            grep -qE "[\"']${tag}[\"']" "$script" ||
              { echo "$script does not default to the $tag release"; exit 1; }
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          only_changelog_changed() {
            gh api "repos/$GITHUB_REPOSITORY/compare/$1...$2" \
              --jq '.status == "identical" or (.status == "ahead" and .total_commits <= 250 and ((.files // []) | length) > 0 and ((.files // []) | all(.filename == "CHANGELOG.md" and (.previous_filename // "CHANGELOG.md") == "CHANGELOG.md")))'
          }
          dated_tag="$RELEASE_TAG.$(date -u +%Y%m%d)"
          build=true
          previous_sha=""
          if [ "$EVENT" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ] &&
            dated=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$dated_tag" --jq .object.sha 2>/dev/null); then
            if [ "$dated" = "$GITHUB_SHA" ]; then
              echo "The $dated_tag release already holds $GITHUB_SHA."
            elif [ "$(only_changelog_changed "$dated" "$GITHUB_SHA")" = true ]; then
              echo "The $dated_tag release holds $dated, and only CHANGELOG.md changed since."
            else
              echo "The $dated_tag release holds $dated, not $GITHUB_SHA, and a dated release is never replaced."
              exit 1
            fi
            build=false
          fi
          if published=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null); then
            previous_sha="$published"
            if [ "$EVENT" = schedule ]; then
              if [ "$published" = "$GITHUB_SHA" ]; then
                echo "The $RELEASE_TAG release already holds $GITHUB_SHA."
                build=false
              elif [ "$(only_changelog_changed "$published" "$GITHUB_SHA")" = true ]; then
                echo "Only CHANGELOG.md changed since $RELEASE_TAG ($published)."
                build=false
              fi
            fi
          fi
          {
            echo "build=$build"
            echo "previous_sha=$previous_sha"
            echo "dated_tag=$dated_tag"
          } >> "$GITHUB_OUTPUT"

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install git-cliff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/git-cliff-download" "$RUNNER_TEMP/git-cliff-bin"
          gh release download --repo orhun/git-cliff \
            --pattern 'git-cliff-*-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern 'git-cliff-*-x86_64-unknown-linux-gnu.tar.gz.sha512' \
            --dir "$RUNNER_TEMP/git-cliff-download"
          (cd "$RUNNER_TEMP/git-cliff-download" && sha512sum --check ./*.sha512)
          tar -xzf "$RUNNER_TEMP/git-cliff-download"/git-cliff-*-x86_64-unknown-linux-gnu.tar.gz \
            --strip-components=1 -C "$RUNNER_TEMP/git-cliff-bin" --wildcards '*/git-cliff'
          echo "$RUNNER_TEMP/git-cliff-bin" >> "$GITHUB_PATH"
      - name: Validate changelog generation
        run: |
          python3 -I .github/scripts/changelog.py \
            --from 08b6db3954b7b6ca33ca69029cc6525410e13175 \
            --to HEAD \
            --notes "$RUNNER_TEMP/changes.md"
          test -s "$RUNNER_TEMP/changes.md"
          cp CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"
          python3 -I .github/scripts/changelog.py \
            --from HEAD \
            --to HEAD \
            --prepend \
            --output "$RUNNER_TEMP/CHANGELOG.md"
          cmp -s CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: earnest
            archive: earnest-linux-x64-gnu.tar.gz
            runs_here: true
          - platform: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary: earnest
            archive: earnest-linux-arm64-gnu.tar.gz
            runs_here: true
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            binary: earnest
            archive: earnest-darwin-arm64.tar.gz
            runs_here: true
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
            binary: earnest
            archive: earnest-darwin-x64.tar.gz
            runs_here: false
          - platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: earnest.exe
            archive: earnest-win32-x64-msvc.zip
            runs_here: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET" --no-self-update
      - run: rustup default "$RUST_VERSION"
      - run: cargo build --release --locked -p earnest-cli --target "$TARGET"
      - name: Smoke test
        if: matrix.runs_here
        run: |
          "target/$TARGET/release/$BINARY" --version
          "target/$TARGET/release/$BINARY" verify --no-cache "$SMOKE_MODEL"
      - name: Check the architecture of a binary this runner cannot run
        if: ${{ !matrix.runs_here }}
        run: lipo "target/$TARGET/release/$BINARY" -verify_arch x86_64
      - name: Pack
        run: |
          mkdir -p stage dist
          cp "target/$TARGET/release/$BINARY" stage/
          case "$ARCHIVE" in
            *.zip) pwsh -NoProfile -Command "Compress-Archive -Path 'stage/$BINARY' -DestinationPath 'dist/$ARCHIVE'" ;;
            *) tar -czf "dist/$ARCHIVE" -C stage "$BINARY" ;;
          esac
      - name: Write the checksum
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          cat "$ARCHIVE.sha256"
      - name: Install from the archive with install.sh
        if: matrix.runs_here && runner.os != 'Windows'
        env:
          EARNEST_DOWNLOAD_URL: file://${{ github.workspace }}/dist
          EARNEST_INSTALL_DIR: ${{ runner.temp }}/installed
        run: |
          sh install.sh
          "$EARNEST_INSTALL_DIR/earnest" verify --no-cache "$SMOKE_MODEL"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [decide, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Check the downloaded files
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum --check ./*.sha256
      - name: Install git-cliff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/git-cliff-download" "$RUNNER_TEMP/git-cliff-bin"
          gh release download --repo orhun/git-cliff \
            --pattern 'git-cliff-*-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern 'git-cliff-*-x86_64-unknown-linux-gnu.tar.gz.sha512' \
            --dir "$RUNNER_TEMP/git-cliff-download"
          (cd "$RUNNER_TEMP/git-cliff-download" && sha512sum --check ./*.sha512)
          tar -xzf "$RUNNER_TEMP/git-cliff-download"/git-cliff-*-x86_64-unknown-linux-gnu.tar.gz \
            --strip-components=1 -C "$RUNNER_TEMP/git-cliff-bin" --wildcards '*/git-cliff'
          echo "$RUNNER_TEMP/git-cliff-bin" >> "$GITHUB_PATH"
      - name: Update changelog and generate release notes
        env:
          PREVIOUS_SHA: ${{ needs.decide.outputs.previous_sha }}
          RELEASE_TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if [ -n "$PREVIOUS_SHA" ]; then
            python3 -I .github/scripts/changelog.py \
              --from "$PREVIOUS_SHA" \
              --to "$GITHUB_SHA" \
              --tag "$RELEASE_TAG" \
              --notes "$RUNNER_TEMP/changes.md" \
              --prepend
          else
            python3 -I .github/scripts/changelog.py \
              --to "$GITHUB_SHA" \
              --tag "$RELEASE_TAG" \
              --notes "$RUNNER_TEMP/changes.md" \
              --prepend
          fi
      - name: Write the release notes
        env:
          DATED_TAG: ${{ needs.decide.outputs.dated_tag }}
        run: |
          echo "The tip of \`main\` at commit $GITHUB_SHA ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), built on $(date -u +%Y-%m-%d)." > "$RUNNER_TEMP/common.md"
          {
            cat "$RUNNER_TEMP/common.md"
            cat <<'NOTES'

          This is not a release: it is replaced every night that `main` has changed more than `CHANGELOG.md`, and it has had no more checking than `main` itself. To pin a build, use the dated release of the same night: its tag ends in `-nightly.` and the date.
          NOTES
            echo
            echo "That is \`$DATED_TAG\`."
            cat <<'NOTES'

          Each archive holds one binary, `earnest` (`earnest.exe` on Windows), and has a `.sha256` file beside it. To check a download, keep both in one folder and run:

          ```sh
          sha256sum --check earnest-linux-x64-gnu.tar.gz.sha256      # Linux
          shasum -a 256 --check earnest-darwin-arm64.tar.gz.sha256   # macOS
          ```

          On Windows, compare `(Get-FileHash earnest-win32-x64-msvc.zip).Hash` in PowerShell with the first word of `earnest-win32-x64-msvc.zip.sha256`; case does not matter.
          NOTES
            if [ -s "$RUNNER_TEMP/changes.md" ]; then
              printf '\n## Changes\n\n'
              sed '1{/^## /d;}; 2{/^$/d;}' "$RUNNER_TEMP/changes.md"
            fi
          } > "$RUNNER_TEMP/notes.md"
          {
            cat "$RUNNER_TEMP/common.md"
            cat <<'NOTES'

          This release is never replaced, so its tag names one build. The workflow removes it 90 days after its date. It is not a release and has had no more checking than `main` itself.

          Install it with `EARNEST_VERSION` set to this tag, for `install.sh` or `install.ps1`.

          Each archive holds one binary, `earnest` (`earnest.exe` on Windows), and has a `.sha256` file beside it. To check a download, keep both in one folder and run:

          ```sh
          sha256sum --check earnest-linux-x64-gnu.tar.gz.sha256      # Linux
          shasum -a 256 --check earnest-darwin-arm64.tar.gz.sha256   # macOS
          ```

          On Windows, compare `(Get-FileHash earnest-win32-x64-msvc.zip).Hash` in PowerShell with the first word of `earnest-win32-x64-msvc.zip.sha256`; case does not matter.
          NOTES
            if [ -s "$RUNNER_TEMP/changes.md" ]; then
              printf '\n## Changes\n\n'
              sed '1{/^## /d;}; 2{/^$/d;}' "$RUNNER_TEMP/changes.md"
            fi
          } > "$RUNNER_TEMP/dated-notes.md"
      - name: Publish the dated release, which is never replaced
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DATED_TAG: ${{ needs.decide.outputs.dated_tag }}
        run: |
          gh release create "$DATED_TAG" "$RUNNER_TEMP"/dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "$DATED_TAG: nightly build of main" \
            --notes-file "$RUNNER_TEMP/dated-notes.md"
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent 2>/dev/null; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$RELEASE_TAG: nightly build of main" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: Push updated changelog
        run: |
          if ! git diff --quiet -- CHANGELOG.md || [ -n "$(git ls-files --others --exclude-standard -- CHANGELOG.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(changelog): update CHANGELOG.md [skip ci]"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                git fetch origin main
                git rebase origin/main
              fi
            done
            if [ "$pushed" != true ]; then
              echo "Failed to push CHANGELOG.md after 3 attempts."
              exit 1
            fi
          fi
      - name: Remove dated nightlies older than 90 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAYS_KEPT: "90"
        run: |
          oldest_kept=$(date -u -d "$DAYS_KEPT days ago" +%Y%m%d)
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            grep -E -- '-nightly\.[0-9]{8}$' |
            while read -r tag; do
              if [ "${tag##*.}" -lt "$oldest_kept" ]; then
                gh release delete "$tag" --cleanup-tag --yes
              fi
            done

  installed:
    needs: [decide, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the published nightly with install.sh
        if: runner.os != 'Windows'
        env:
          EARNEST_VERSION: ${{ needs.decide.outputs.dated_tag }}
          EARNEST_INSTALL_DIR: ${{ runner.temp }}/installed
        run: |
          sh install.sh
          "$EARNEST_INSTALL_DIR/earnest" --version | grep -F "commit ${GITHUB_SHA:0:12}"
          "$EARNEST_INSTALL_DIR/earnest" verify --no-cache "$SMOKE_MODEL"
      - name: Install the published nightly with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EARNEST_VERSION: ${{ needs.decide.outputs.dated_tag }}
          EARNEST_INSTALL_DIR: ${{ runner.temp }}\installed
        run: |
          ./install.ps1
          if (-not ((& "$env:EARNEST_INSTALL_DIR\earnest.exe" --version) -like "*commit $($env:GITHUB_SHA.Substring(0, 12))*")) { throw "version does not name the commit" }
          & "$env:EARNEST_INSTALL_DIR\earnest.exe" verify --no-cache $env:SMOKE_MODEL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
